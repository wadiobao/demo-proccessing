apiVersion: v1
kind: Service
metadata:
  name: demo-app-service
  labels:
    app: demo-app
spec:
  # ClusterIP  — internal only, use with an Ingress controller for external access
  # NodePort   — exposes on a static port on each node (dev/testing)
  # LoadBalancer — provisions a cloud LB (OKE, GKE, EKS); incurs cost
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
