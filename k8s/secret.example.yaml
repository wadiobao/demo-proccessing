apiVersion: v1
kind: Secret
metadata:
  name: demo-secrets
type: Opaque
stringData:
  # --- Gemini AI ---
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
  GEMINI_API_KEY_IMAGE: "YOUR_GEMINI_IMAGE_API_KEY"
  GEMINI_API_KEY_TOPIC: "YOUR_GEMINI_TOPIC_API_KEY"

  # --- MySQL (Railway) ---
  # Use plain host:port format — credentials go into DB_USERNAME / DB_PASSWORD separately
  DB_URL: "jdbc:mysql://YOUR_MYSQL_HOST:PORT/railway"
  DB_USERNAME: "root"
  DB_PASSWORD: "YOUR_MYSQL_PASSWORD"

  # --- MongoDB Atlas ---
  MONGODB_DATABASE: "pdfstore"
  MONGODB_URI: "mongodb+srv://YOUR_USER:YOUR_PASSWORD@YOUR_CLUSTER.mongodb.net/?retryWrites=true&w=majority"

  # --- Cloudinary ---
  CLOUDINARY_WEBHOOK_SECRET: "YOUR_CLOUDINARY_WEBHOOK_SECRET"
  CLOUDINARY_API_KEY: "YOUR_CLOUDINARY_API_KEY"
  CLOUDINARY_API_SECRET: "YOUR_CLOUDINARY_API_SECRET"
  CLOUDINARY_CLOUD_NAME: "YOUR_CLOUD_NAME"

  # --- Redis ---
  REDIS_HOST: "YOUR_REDIS_HOST"
  REDIS_PORT: "YOUR_REDIS_PORT"
  REDIS_USERNAME: "default"
  REDIS_PASSWORD: "YOUR_REDIS_PASSWORD"

  # --- Mail (Gmail App Password) ---
  MAIL_USERNAME: "your-email@gmail.com"
  MAIL_PASSWORD: "YOUR_GMAIL_APP_PASSWORD"

  # --- Security & JWT ---
  # Generate with: openssl rand -base64 64
  JWT_SECRET_KEY: "YOUR_JWT_SECRET_KEY_MIN_64_CHARS"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
